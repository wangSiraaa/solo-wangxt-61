services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilot
      POSTGRES_DB: pilotage
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot -d pilotage"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://pilot:pilot@db:5432/pilotage
      DISEMBARK_MINUTES: "10"
      SOLVER_TIME_LIMIT_SECONDS: "10"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # 仅用于 CI：SQLite 后端跑确定性测试
  tests:
    build: .
    environment:
      DATABASE_URL: "sqlite:////tmp/pilotage-test.db"
      SOLVER_TIME_LIMIT_SECONDS: "5"
    command: >
      sh -c "pip install --no-cache-dir pytest && python -m pytest -q"
    profiles: ["test"]
